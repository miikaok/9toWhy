# Wisecom Trace: AI review for every pull request, posted as the Wisecom Trace
# GitHub App bot. Copy to .github/workflows/ in the reviewed repository.
#
# The App (owned by wisecom-oy) must be installed on the reviewed repository
# and on wisecom-oy/trace. Repository settings (Settings -> Secrets and
# variables -> Actions):
#   vars.TRACE_GITHUB_APP_ID      GitHub App id
#   secrets.TRACE_GITHUB_APP_KEY  GitHub App private key (PEM)
#   secrets.OPENROUTER_API_KEY    OpenRouter key
name: Wisecom Trace review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Review an existing PR on demand: Actions -> Wisecom Trace review -> Run workflow.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        type: number
        required: true
  # Review on request: a comment `@wisecom-trace review` on the PR. GitHub runs
  # this workflow file from the default branch, so edits here apply after merge.
  issue_comment:
    types: [created]

# A new push supersedes the review of the previous head.
concurrency:
  group: trace-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

# The workflow token only reads; comments are posted with the App's own token.
permissions:
  contents: read

jobs:
  review:
    # Fork PRs get no secrets, and drafts are not ready for review. Manual runs
    # are started by someone with write access, so they are always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.sender.type != 'Bot' &&
        contains(github.event.comment.body, '@wisecom-trace review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Read-only token for the private Trace source, minted from the App.
      - id: source
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TRACE_GITHUB_APP_ID }}
          private-key: ${{ secrets.TRACE_GITHUB_APP_KEY }}
          owner: wisecom-oy
          repositories: trace
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: wisecom-oy/trace
          token: ${{ steps.source.outputs.token }}
          path: trace
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: trace/go.mod
          cache-dependency-path: trace/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./build.sh
        working-directory: trace
      - name: Review and publish
        run: |
          comment_args=()
          if [ -n "$COMMENT_ID" ]; then comment_args=(--comment-id "$COMMENT_ID"); fi
          trace/bin/trace pr --verbose --target "github:${GITHUB_REPOSITORY}#${PR_NUMBER}" "${comment_args[@]}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          COMMENT_ID: ${{ github.event.comment.id }}
          TRACE_MODEL: z-ai/glm-5.3-flash
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_KEY: ${{ secrets.TRACE_GITHUB_APP_KEY }}
